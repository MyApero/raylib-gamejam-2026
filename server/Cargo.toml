[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "2.6"
log = "0.4"
# wasm32-unknown-unknown's std does not link transcendental float functions
# (sin/cos/atan2), needed by the hue-merge circular-mean formula.
libm = "0.2"
# F10: hashes the admin password so only its SHA-256 digest, never the
# plaintext, lives in this public repo.
sha2 = { version = "0.10", default-features = false }
shared = { path = "../shared" }

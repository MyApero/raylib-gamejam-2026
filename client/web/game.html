<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>hexel — raylib 6.0 + SpacetimeDB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      body { margin: 0; overflow: hidden; background-color: black; }
      canvas#canvas {
        border: 0 none;
        background-color: black;
        display: block;
        margin: 0 auto;
        /* Keep the 720x720 game square and fully on-screen (no scroll/zoom
           needed) on any viewport, phones included; the internal render
           resolution stays 720x720 regardless of this CSS size. */
        width: 100vmin;
        height: 100vmin;
        touch-action: none;
      }
      #output {
        color: #9a9a9a;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 15vh;
        overflow-y: auto;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <pre id="output"></pre>
    <script>
      // Cache-busting: browsers (and some CDNs) aggressively cache
      // web.js/web.wasm by filename, so a clean `./build-web.sh` rebuild can
      // silently keep serving a stale wasm binary until a hard-reload — this
      // was the actual cause of the "hearts don't show on web" symptom, not
      // a code bug (heart rendering already lives in shared ui.rs). Bump
      // BUILD_VERSION on every deploy so both the script tag below and the
      // wasm fetch (via Module.locateFile) get a fresh URL each time.
      var BUILD_VERSION = '20260715h';
      var Module = {
        canvas: document.getElementById('canvas'),
        locateFile: function (path) {
          return (path.endsWith('.wasm') || path.endsWith('.data'))
            ? path + '?v=' + BUILD_VERSION
            : path;
        },
        print: (function () {
          var el = document.getElementById('output');
          return function (text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            el.textContent += text + '\n';
            el.scrollTop = el.scrollHeight;
          };
        })(),
      };
      Module.printErr = Module.print;
    </script>
    <script>
      // F9.5 item 8: Safari (macOS) trackpad scroll zooms in huge,
      // uncontrollable steps. The game's zoom step is `wheel_delta * 0.1`
      // (client/src/main.rs / bin/web.rs), fed by whatever raw `deltaY` the
      // browser reports through Emscripten's GLFW3 wheel handling — Chrome
      // and Firefox report modest per-tick deltas for a trackpad scroll,
      // but Safari reports MUCH larger raw deltaY magnitudes for the same
      // physical gesture (a longstanding cross-browser wheel-event quirk,
      // not an Emscripten bug), so the same zoom formula produces a huge
      // jump there. Emscripten's own GLFW3 shim is prebuilt (not part of
      // this repo) and applies only generic deltaMode scaling, not a
      // magnitude clamp — so this intercepts the RAW event on the canvas in
      // the capture phase (which always runs before Emscripten's own
      // bubble-phase listener, regardless of script load order), normalizes
      // by `deltaMode`, clamps the per-event magnitude, and re-dispatches a
      // synthetic replacement for Emscripten to consume instead. The
      // `isTrusted` check is what stops that re-dispatch from looping back
      // into this same handler (synthetic events are always untrusted, real
      // user input never is).
      (function () {
        var canvas = document.getElementById('canvas');
        // Empirically generous for a normal Chrome/Firefox per-tick delta
        // (~100-120 at deltaMode 0) while still clamping Safari's outsized
        // trackpad values down to roughly the same effective step.
        var MAX_WHEEL_DELTA = 120;
        canvas.addEventListener('wheel', function (e) {
          if (!e.isTrusted) return; // our own re-dispatch, let it through as-is
          var dy = e.deltaY;
          // DOM_DELTA_LINE (1) / DOM_DELTA_PAGE (2) -> approximate pixels,
          // matching what most browsers already assume at deltaMode 0.
          if (e.deltaMode === 1) dy *= 16;
          else if (e.deltaMode === 2) dy *= 100;
          var sign = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
          var clamped = sign * Math.min(Math.abs(dy), MAX_WHEEL_DELTA);
          if (clamped === e.deltaY && e.deltaMode === 0) return; // already normalized, nothing to rewrite
          e.preventDefault();
          e.stopImmediatePropagation();
          canvas.dispatchEvent(new WheelEvent('wheel', {
            deltaY: clamped,
            deltaMode: 0,
            clientX: e.clientX,
            clientY: e.clientY,
            bubbles: true,
            cancelable: true,
          }));
        }, { capture: true, passive: false });

        // Safari's proprietary two-finger trackpad PINCH (distinct from a
        // two-finger scroll, which is the 'wheel' path above) fires
        // gesturestart/gesturechange/gestureend instead, and left
        // unhandled would zoom the whole browser page/viewport rather than
        // the game camera. No other browser fires these, so this is a
        // no-op elsewhere.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
          canvas.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
        });
      })();
    </script>
    <script>
      // SpacetimeDB WebSocket client (v1.json.spacetimedb). The socket and
      // its event handlers live here in JS; the wasm game loop pulls
      // everything through stdb.frame() once per frame (a mailbox), because
      // emscripten code can't own a browser WebSocket directly. Protocol
      // shapes must match what client/src/bin/web.rs parses.
      window.stdb = (function () {
        // Local/LAN dev talks to `spacetime start` directly on :3000 (see
        // WORK.md). The public deploy sits behind Caddy, which reverse-
        // proxies SpacetimeDB through the default TLS port instead — 3000
        // isn't publicly reachable there, so the port must be omitted for
        // any non-local hostname.
        var LOCAL_PORT = 3000;
        var LOCAL_HOST_RE = /^(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})$/;
        // Production serves this page from hexel.mister-esman.uk, a
        // separate Caddy site (static file_server) from the SpacetimeDB
        // backend at spacetime.mister-esman.uk (reverse-proxied). They are
        // not the same origin, so the public deploy can't reuse the page's
        // own hostname the way local/LAN dev does.
        var PUBLIC_HOST = 'spacetime.mister-esman.uk';
        var DB = 'hexel';
        var PROTOCOL = 'v1.json.spacetimedb';
        var TABLES = [
          'SELECT * FROM config',
          'SELECT * FROM user',
          'SELECT * FROM inventory',
          'SELECT * FROM island',
          'SELECT * FROM island_like',
          'SELECT * FROM island_cell',
          'SELECT * FROM margin_cell',
          'SELECT * FROM gift',
          'SELECT * FROM hexa_event',
          'SELECT * FROM hexa_cluster',
          'SELECT * FROM merge_event',
        ];
        // localStorage (not sessionStorage) so identity survives inside the
        // itch.io iframe and across tab reloads (F6 recovery path). Same
        // origin normally means one shared identity across every open
        // tab/frame — the local two-player test harness (index.html) opts
        // out of that by loading this page as `game.html?slot=1|2`, which
        // namespaces the storage key so its two iframes get distinct
        // identities despite being same-origin.
        var params = new URLSearchParams(window.location.search);
        var slot = params.get('slot');
        var TOKEN_KEY = slot ? 'stdb_token_slot' + slot : 'stdb_token';

        var queue = [];
        var status = 'connecting';
        var identity = null;
        var ws = null;
        var requestId = 10;
        var failedBeforeOpen = 0;
        // Author follow-up (2026-07-12): set by a rejected trial import
        // connection (see `importToken` below), read-once by `frame()`, same
        // pattern as `queue`.
        var importError = null;

        // Shared by `connect()` and `importToken()`'s trial connection —
        // both need the exact same local-vs-public host/port resolution.
        function wsUrl(token) {
          var scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
          var isLocal = LOCAL_HOST_RE.test(window.location.hostname);
          var host = isLocal ? window.location.hostname : PUBLIC_HOST;
          var port = isLocal ? ':' + LOCAL_PORT : '';
          return scheme + '://' + host + port
               + '/v1/database/' + DB + '/subscribe'
               + (token ? '?token=' + encodeURIComponent(token) : '');
        }

        function connect() {
          var token = localStorage.getItem(TOKEN_KEY);
          var url = wsUrl(token);
          var opened = false;
          status = 'connecting';
          ws = new WebSocket(url, PROTOCOL);
          ws.onopen = function () {
            opened = true;
            failedBeforeOpen = 0;
            status = 'open';
            ws.send(JSON.stringify({
              Subscribe: { query_strings: TABLES, request_id: 1 },
            }));
          };
          ws.onmessage = function (ev) {
            if (typeof ev.data !== 'string') return;
            // Persist the token here rather than in wasm so it survives
            // even if the game hasn't finished loading yet.
            if (ev.data.lastIndexOf('{"IdentityToken"', 0) === 0) {
              try {
                var m = JSON.parse(ev.data).IdentityToken;
                identity = m.identity.__identity__;
                localStorage.setItem(TOKEN_KEY, m.token);
              } catch (e) { /* wasm side will still see the raw message */ }
            }
            queue.push(ev.data);
          };
          ws.onclose = function () {
            status = 'closed';
            if (!opened) {
              failedBeforeOpen++;
              // A stored token the server keeps rejecting (expired, or the
              // server was wiped) would otherwise loop forever — drop it
              // and reconnect anonymously.
              if (failedBeforeOpen >= 2 && token) {
                localStorage.removeItem(TOKEN_KEY);
                failedBeforeOpen = 0;
              }
            }
            setTimeout(connect, 1000);
          };
        }

        connect();
        return {
          // One call per frame: connection state, our identity, the
          // browser clock (for presence checks), and every server message
          // received since the previous frame.
          frame: function () {
            var err = importError;
            importError = null;
            return JSON.stringify({
              status: status,
              identity: identity,
              now_micros: Date.now() * 1000,
              msgs: queue.splice(0),
              import_error: err,
            });
          },
          callReducer: function (name, argsJson) {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({
                CallReducer: { reducer: name, args: argsJson, request_id: requestId++, flags: 0 },
              }));
            }
          },
          // F6 account portability: the stored token IS the reconnection
          // identifier (see plan.md decision 11), so "copy ID" really copies
          // the token. Clipboard writes need a secure context + user
          // gesture, both satisfied here (https/localhost, called from a
          // click), but the itch.io iframe may still deny
          // navigator.clipboard outright — window.prompt's pre-selected
          // text is the fallback manual-copy path either way.
          copyToken: function () {
            var token = localStorage.getItem(TOKEN_KEY);
            if (!token) return;
            function fallback() {
              window.prompt('Copy your ID (already selected, press Ctrl+C / Cmd+C):', token);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(token).catch(fallback);
            } else {
              fallback();
            }
          },
          // Author follow-up (2026-07-12): the old version stored the pasted
          // token and reloaded immediately — if the token turned out to be
          // invalid/expired, the reload's own `connect()` would fail twice
          // and silently drop it (see `failedBeforeOpen` above), leaving the
          // player looking at a freshly-minted anonymous account with no
          // explanation and the account they meant to import gone from the
          // input field too. Instead, open a SEPARATE trial socket with the
          // pasted token first (auth is a connect-time query param, so
          // validating it needs its own connection either way) and only
          // touch `TOKEN_KEY`/reload once that trial socket actually proves
          // the token live by receiving a real IdentityToken back — a
          // rejection reports `importError` (read by `frame()`, surfaced as
          // a toast on the Rust side) and leaves the CURRENT session's token
          // and connection completely untouched.
          importToken: function (token) {
            if (!token) return;
            var trialWs = new WebSocket(wsUrl(token), PROTOCOL);
            var settled = false;
            var timeout = setTimeout(function () {
              if (settled) return;
              settled = true;
              importError = 'Import failed: no response from server.';
              try { trialWs.close(); } catch (e) {}
            }, 8000);
            trialWs.onmessage = function (ev) {
              if (settled || typeof ev.data !== 'string') return;
              if (ev.data.lastIndexOf('{"IdentityToken"', 0) === 0) {
                settled = true;
                clearTimeout(timeout);
                localStorage.setItem(TOKEN_KEY, token);
                trialWs.close();
                window.location.reload();
              }
            };
            trialWs.onclose = function () {
              if (settled) return;
              settled = true;
              clearTimeout(timeout);
              importError = 'Import failed: that ID was rejected (invalid or expired).';
            };
          },
          // Keep downloads in one browser-tested path.  Appending the anchor
          // briefly matters on Safari and embedded web views, where clicking
          // a detached anchor is ignored.
          downloadBlob: function (blob, filename) {
            if (!blob || !blob.size) {
              console.warn('Export produced no data for ' + filename + '.');
              return false;
            }
            var link = document.createElement('a');
            var url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
            return true;
          },
          // The Rust frame has already rendered the clean share card when
          // this runs. Turning the game canvas into a Blob keeps the web
          // export a real PNG download rather than an OS-specific screenshot.
          downloadIslandImage: function () {
            var api = this;
            var canvas = document.getElementById('canvas');
            if (!canvas || !canvas.toBlob) return;
            canvas.toBlob(function (blob) {
              api.downloadBlob(blob, 'hexel-island.png');
            }, 'image/png');
          },
          // Browser-native replay export. `captureStream` records the exact
          // canvas the player sees (including the replay controls) without
          // moving hundreds of megabytes of frames through wasm. WebM is
          // broadly supported by Chromium and Firefox; it can be converted
          // to GIF/MP4 afterwards when a different delivery format is needed.
          startReplayRecording: function () {
            var api = this;
            var canvas = document.getElementById('canvas');
            if (!canvas || !canvas.captureStream || !window.MediaRecorder) {
              console.warn('Replay recording is not supported by this browser.');
              return false;
            }
            if (this.replayRecorder && this.replayRecorder.state !== 'inactive') return false;
            var mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
              .find(function (type) { return MediaRecorder.isTypeSupported(type); });
            var chunks = [];
            var recorder;
            try {
              recorder = mimeType
                ? new MediaRecorder(canvas.captureStream(60), { mimeType: mimeType })
                : new MediaRecorder(canvas.captureStream(60));
            } catch (error) {
              console.warn('Could not start replay recording.', error);
              return false;
            }
            this.replayRecorder = recorder;
            recorder.ondataavailable = function (event) {
              if (event.data && event.data.size) chunks.push(event.data);
            };
            recorder.onstop = function () {
              api.replayRecorder = null;
              if (!chunks.length) {
                console.warn('Replay recording completed without video data.');
                return;
              }
              var blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
              api.downloadBlob(blob, 'hexel-island-timelapse.webm');
            };
            // One final dataavailable event is emitted by stop(), so no
            // periodic chunks are required before the eight-second export
            // completes. This is more reliable in Firefox and Safari.
            recorder.start();
            return true;
          },
          stopReplayRecording: function () {
            var recorder = this.replayRecorder;
            if (recorder && recorder.state !== 'inactive') recorder.stop();
          },
          // The compact GIF bytes are encoded in wasm by raylib's bundled
          // msf_gif implementation. Copy them out of wasm memory before the
          // Rust caller frees the encoder result, then download normally.
          downloadReplayGif: function (ptr, length) {
            // Emscripten keeps HEAPU8 in its generated script scope. The
            // normal build exposes it globally; Module.HEAPU8 is supported
            // too for builds that explicitly export runtime methods.
            var heap = typeof HEAPU8 !== 'undefined'
              ? HEAPU8
              : (window.Module && window.Module.HEAPU8);
            if (!ptr || !length || !heap) return false;
            var bytes = heap.slice(ptr, ptr + length);
            var blob = new Blob([bytes], { type: 'image/gif' });
            return this.downloadBlob(blob, 'hexel-island-timelapse.gif');
          },
        };
      })();
    </script>
    <!-- Built by: cargo build -p client --bin web --target wasm32-unknown-emscripten --release -->
    <script>document.write('<script src="web.js?v=' + BUILD_VERSION + '"><' + '/script>');</script>
  </body>
</html>

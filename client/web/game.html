<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>hexel</title>
    <!-- ?v= for the same reason web.js carries one: this zone has a
         Cloudflare Browser Cache TTL that rewrites the origin's
         Cache-Control, so a changed icon otherwise stays stale at the edge. -->
    <link rel="icon" href="favicon.ico?v=20260726t" sizes="any">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      /* One unit of the game's internal 720x720 render space, in CSS pixels.
         The canvas always renders at 720x720 internally but is *displayed* at
         100vmin, so a DOM overlay sized in raw px sits at a different apparent
         scale than the same number drawn in-game — on a 390px-wide phone the
         game's 14px text lands at ~7.6 CSS px while a 14px overlay stays 14.
         Sizing the overlay in these units keeps it locked to the game's own
         proportions at every viewport size. */
      :root { --game-px: calc(100vmin / 720); }
      body { margin: 0; overflow: hidden; background-color: black; }
      canvas#canvas {
        border: 0 none;
        background-color: black;
        display: block;
        margin: 0 auto;
        /* Keep the 720x720 game square and fully on-screen (no scroll/zoom
           needed) on any viewport, phones included; the internal render
           resolution stays 720x720 regardless of this CSS size. */
        width: 100vmin;
        height: 100vmin;
        touch-action: none;
      }
      #output {
        color: #9a9a9a;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 15vh;
        overflow-y: auto;
        margin: 0;
        /* Off on the shipped page: it ate the top of a phone screen, and
           `Module.print` mirrors every line to console.log anyway. Drop this
           one line to get the on-page log back. */
        display: none;
      }
      /* Portrait (i.e. a phone): the square is 100vmin = the full width, so
         all the slack is vertical. Put the game at the BOTTOM, in thumb
         reach, and the log above it.
         Deliberately NO width/height override in here — the 100vmin above is
         already correct. CSS calls a viewport portrait when height >= width,
         so itch.io's exactly-720x720 frame matches this query too, and an
         earlier `min(100vw, 85vh)` cap therefore drew the game at 612px
         inside it. That cap was reserving 15vh for #output, which the
         shipped page hides; re-enabling the log means finding it room some
         other way, not reinstating a cap that also fires on square. */
      @media (orientation: portrait) {
        body { display: flex; flex-direction: column; min-height: 100vh; }
        canvas#canvas { flex: none; margin-top: auto; }
        #output { order: -1; min-height: 0; }
        /* The square now occupies the bottom of the page, where this panel
           used to sit clear of it — move it into the space above instead of
           over the in-game footer. */
        #export-panel { top: 3vmin; bottom: auto; }
      }
      /* Export panel. Mirrors the in-game modal in ui.rs `draw_island_export`
         — same panel fill (24,24,30), same 2px (90,90,100) border, same
         button colours — so it reads as part of the game rather than browser
         chrome. It has to be DOM rather than canvas: the GIF encoder samples
         the framebuffer and the WebM recorder captures the canvas stream, so
         anything drawn in-game would be baked into the exported file. */
      #export-panel {
        position: fixed;
        left: 50%;
        bottom: 3vmin;
        transform: translateX(-50%);
        z-index: 9999;
        display: none;
        /* Every metric below is in game pixels, so the panel keeps the same
           apparent size as the in-game modal it mirrors. 14 matches the
           `draw_text` size ui.rs uses for the export panel's own body text. */
        min-width: calc(250 * var(--game-px));
        padding: calc(12 * var(--game-px)) calc(14 * var(--game-px));
        background: rgb(24, 24, 30);
        border: max(1px, calc(2 * var(--game-px))) solid rgb(90, 90, 100);
        color: #f5f5f5;
        font-family: monospace;
        font-size: calc(14 * var(--game-px));
        text-align: center;
      }
      #export-panel-track {
        margin-top: calc(10 * var(--game-px));
        height: calc(8 * var(--game-px));
        background: rgb(36, 36, 44);
        border: max(1px, calc(1 * var(--game-px))) solid rgb(70, 70, 80);
      }
      #export-panel-fill {
        height: 100%;
        width: 0;
        background: rgb(250, 190, 90);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="export-panel">
      <div id="export-panel-label"></div>
      <div id="export-panel-track"><div id="export-panel-fill"></div></div>
    </div>
    <pre id="output"></pre>
    <script>
      // Cache-busting: browsers (and some CDNs) aggressively cache
      // web.js/web.wasm by filename, so a clean `./build-web.sh` rebuild can
      // silently keep serving a stale wasm binary until a hard-reload — this
      // was the actual cause of the "hearts don't show on web" symptom, not
      // a code bug (heart rendering already lives in shared ui.rs). Bump
      // BUILD_VERSION on every deploy so both the script tag below and the
      // wasm fetch (via Module.locateFile) get a fresh URL each time.
      var BUILD_VERSION = '20260726t';
      var Module = {
        canvas: document.getElementById('canvas'),
        locateFile: function (path) {
          return (path.endsWith('.wasm') || path.endsWith('.data'))
            ? path + '?v=' + BUILD_VERSION
            : path;
        },
        print: (function () {
          var el = document.getElementById('output');
          return function (text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            el.textContent += text + '\n';
            el.scrollTop = el.scrollHeight;
          };
        })(),
      };
      Module.printErr = Module.print;
    </script>
    <script>
      // Safari (macOS) trackpad scroll zooms in huge,
      // uncontrollable steps. The game's zoom step is `wheel_delta * 0.1`
      // (client/src/main.rs / bin/web.rs), fed by whatever raw `deltaY` the
      // browser reports through Emscripten's GLFW3 wheel handling — Chrome
      // and Firefox report modest per-tick deltas for a trackpad scroll,
      // but Safari reports MUCH larger raw deltaY magnitudes for the same
      // physical gesture (a longstanding cross-browser wheel-event quirk,
      // not an Emscripten bug), so the same zoom formula produces a huge
      // jump there. Emscripten's own GLFW3 shim is prebuilt (not part of
      // this repo) and applies only generic deltaMode scaling, not a
      // magnitude clamp — so this intercepts the RAW event on the canvas in
      // the capture phase (which always runs before Emscripten's own
      // bubble-phase listener, regardless of script load order), normalizes
      // by `deltaMode`, clamps the per-event magnitude, and re-dispatches a
      // synthetic replacement for Emscripten to consume instead. The
      // `isTrusted` check is what stops that re-dispatch from looping back
      // into this same handler (synthetic events are always untrusted, real
      // user input never is).
      (function () {
        var canvas = document.getElementById('canvas');
        // Empirically generous for a normal Chrome/Firefox per-tick delta
        // (~100-120 at deltaMode 0) while still clamping Safari's outsized
        // trackpad values down to roughly the same effective step.
        var MAX_WHEEL_DELTA = 120;
        canvas.addEventListener('wheel', function (e) {
          if (!e.isTrusted) return; // our own re-dispatch, let it through as-is
          var dy = e.deltaY;
          // DOM_DELTA_LINE (1) / DOM_DELTA_PAGE (2) -> approximate pixels,
          // matching what most browsers already assume at deltaMode 0.
          if (e.deltaMode === 1) dy *= 16;
          else if (e.deltaMode === 2) dy *= 100;
          var sign = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
          var clamped = sign * Math.min(Math.abs(dy), MAX_WHEEL_DELTA);
          if (clamped === e.deltaY && e.deltaMode === 0) return; // already normalized, nothing to rewrite
          e.preventDefault();
          e.stopImmediatePropagation();
          canvas.dispatchEvent(new WheelEvent('wheel', {
            deltaY: clamped,
            deltaMode: 0,
            clientX: e.clientX,
            clientY: e.clientY,
            bubbles: true,
            cancelable: true,
          }));
        }, { capture: true, passive: false });

        // Safari's proprietary two-finger trackpad PINCH (distinct from a
        // two-finger scroll, which is the 'wheel' path above) fires
        // gesturestart/gesturechange/gestureend instead, and left
        // unhandled would zoom the whole browser page/viewport rather than
        // the game camera. No other browser fires these, so this is a
        // no-op elsewhere.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
          canvas.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
        });
      })();
    </script>
    <script>
      // SpacetimeDB WebSocket client (v1.json.spacetimedb). The socket and
      // its event handlers live here in JS; the wasm game loop pulls
      // everything through stdb.frame() once per frame (a mailbox), because
      // emscripten code can't own a browser WebSocket directly. Protocol
      // shapes must match what client/src/bin/web.rs parses.
      window.stdb = (function () {
        // Local/LAN dev talks to `spacetime start` directly on :3000 (see
        // WORK.md). The public deploy sits behind Caddy, which reverse-
        // proxies SpacetimeDB through the default TLS port instead — 3000
        // isn't publicly reachable there, so the port must be omitted for
        // any non-local hostname.
        var LOCAL_PORT = 3000;
        var LOCAL_HOST_RE = /^(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})$/;
        // Production serves this page from hexel.mister-esman.uk, a
        // separate Caddy site (static file_server) from the SpacetimeDB
        // backend at spacetime.mister-esman.uk (reverse-proxied). They are
        // not the same origin, so the public deploy can't reuse the page's
        // own hostname the way local/LAN dev does.
        var PUBLIC_HOST = 'spacetime.mister-esman.uk';
        var params = new URLSearchParams(window.location.search);
        // `?db=` points the page at another database on the same instance,
        // mirroring the native client's HEXEL_DB. Restricted to the safe
        // name charset because it is interpolated straight into the socket
        // URL path. Unset (or malformed) falls back to production.
        var DB_DEFAULT = 'hexel';
        var DB = (function () {
          var requested = params.get('db');
          return requested && /^[A-Za-z0-9_-]+$/.test(requested) ? requested : DB_DEFAULT;
        })();
        var PROTOCOL = 'v1.json.spacetimedb';
        // Split in two so the title screen isn't held up by the map. These
        // are all small — a few thousand rows total — and carry everything
        // the title and the local player's own state need, so Draw unlocks
        // as soon as this snapshot lands. Mirrors main.rs's STARTUP_TABLES.
        var STARTUP_TABLES = [
          'SELECT * FROM config',
          'SELECT * FROM user',
          'SELECT * FROM inventory',
          'SELECT * FROM island',
          'SELECT * FROM island_like',
          'SELECT * FROM gift',
          'SELECT * FROM hexa_event',
          'SELECT * FROM hexa_cluster',
          'SELECT * FROM merge_event',
        ];
        // The painted map: tens of thousands of rows, ~96% of the payload,
        // and not drawn at all while the title is up (it shows a baked
        // image). Subscribed immediately, but nothing waits on it.
        var WORLD_TABLES = [
          'SELECT * FROM island_cell',
          'SELECT * FROM margin_cell',
        ];
        // localStorage (not sessionStorage) so identity survives inside the
        // itch.io iframe and across tab reloads (recovery path). Same
        // origin normally means one shared identity across every open
        // tab/frame — the local two-player test harness (index.html) opts
        // out of that by loading this page as `game.html?slot=1|2`, which
        // namespaces the storage key so its two iframes get distinct
        // identities despite being same-origin. A non-default `?db=` is
        // namespaced the same way: an identity only means something on the
        // database that issued it, so pointing at another one must not
        // clobber the production token sitting in the same localStorage.
        var slot = params.get('slot');
        var TOKEN_KEY = (slot ? 'stdb_token_slot' + slot : 'stdb_token')
                      + (DB === DB_DEFAULT ? '' : '_db_' + DB);

        var queue = [];
        var status = 'connecting';
        var identity = null;
        var ws = null;
        var requestId = 10;
        var failedBeforeOpen = 0;
        // Set by a rejected trial import
        // connection (see `importToken` below), read-once by `frame()`, same
        // pattern as `queue`.
        var importError = null;

        // Shared by `connect()` and `importToken()`'s trial connection —
        // both need the exact same local-vs-public host/port resolution.
        function wsUrl(token) {
          var scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
          var isLocal = LOCAL_HOST_RE.test(window.location.hostname);
          var host = isLocal ? window.location.hostname : PUBLIC_HOST;
          var port = isLocal ? ':' + LOCAL_PORT : '';
          return scheme + '://' + host + port
               + '/v1/database/' + DB + '/subscribe'
               + (token ? '?token=' + encodeURIComponent(token) : '');
        }

        function connect() {
          var token = localStorage.getItem(TOKEN_KEY);
          var url = wsUrl(token);
          var opened = false;
          status = 'connecting';
          ws = new WebSocket(url, PROTOCOL);
          ws.onopen = function () {
            opened = true;
            failedBeforeOpen = 0;
            status = 'open';
            // SubscribeMulti, NOT Subscribe: a second `Subscribe` REPLACES
            // the whole query set rather than adding to it (it is documented
            // that way in client-api-messages), so sending the world set
            // second silently unsubscribed every small table. They kept the
            // rows from their initial snapshot and then never updated again —
            // cursors frozen where they were, and your own brush colour stuck
            // at whatever it was when you connected, because both read the
            // `user` table. SubscribeMulti is additive, keyed by query_id.
            // In this order: the wasm side treats the first snapshot of a
            // connection as the one that resets local tables, so the light
            // set must arrive first.
            ws.send(JSON.stringify({
              SubscribeMulti: {
                query_strings: STARTUP_TABLES,
                request_id: 1,
                query_id: { id: 1 },
              },
            }));
            ws.send(JSON.stringify({
              SubscribeMulti: {
                query_strings: WORLD_TABLES,
                request_id: 2,
                query_id: { id: 2 },
              },
            }));
          };
          ws.onmessage = function (ev) {
            if (typeof ev.data !== 'string') return;
            // Persist the token here rather than in wasm so it survives
            // even if the game hasn't finished loading yet.
            if (ev.data.lastIndexOf('{"IdentityToken"', 0) === 0) {
              try {
                var m = JSON.parse(ev.data).IdentityToken;
                identity = m.identity.__identity__;
                localStorage.setItem(TOKEN_KEY, m.token);
              } catch (e) { /* wasm side will still see the raw message */ }
            }
            queue.push(ev.data);
          };
          ws.onclose = function () {
            status = 'closed';
            if (!opened) {
              failedBeforeOpen++;
              // A stored token the server keeps rejecting (expired, or the
              // server was wiped) would otherwise loop forever — drop it
              // and reconnect anonymously.
              if (failedBeforeOpen >= 2 && token) {
                localStorage.removeItem(TOKEN_KEY);
                failedBeforeOpen = 0;
              }
            }
            setTimeout(connect, 1000);
          };
        }

        connect();
        return {
          // One call per frame: connection state, our identity, the
          // browser clock (for presence checks), and every server message
          // received since the previous frame.
          frame: function () {
            var err = importError;
            importError = null;
            var returned = !!window.hexelPageReturned;
            window.hexelPageReturned = false;
            var mapReady = !!window.hexelTitleMapReady;
            window.hexelTitleMapReady = false;
            return JSON.stringify({
              status: status,
              identity: identity,
              now_micros: Date.now() * 1000,
              msgs: queue.splice(0),
              import_error: err,
              page_returned: returned,
              title_map_ready: mapReady,
            });
          },
          callReducer: function (name, argsJson) {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({
                CallReducer: { reducer: name, args: argsJson, request_id: requestId++, flags: 0 },
              }));
            }
          },
          // Account portability: the stored token IS the reconnection
          // identifier (see plan.md decision 11), so "copy ID" really copies
          // the token. Clipboard writes need a secure context + user
          // gesture, both satisfied here (https/localhost, called from a
          // click), but the itch.io iframe may still deny
          // navigator.clipboard outright — window.prompt's pre-selected
          // text is the fallback manual-copy path either way.
          copyToken: function () {
            var token = localStorage.getItem(TOKEN_KEY);
            if (!token) return;
            function fallback() {
              window.prompt('Copy your ID (already selected, press Ctrl+C / Cmd+C):', token);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(token).catch(fallback);
            } else {
              fallback();
            }
          },
          // The old version stored the pasted
          // token and reloaded immediately — if the token turned out to be
          // invalid/expired, the reload's own `connect()` would fail twice
          // and silently drop it (see `failedBeforeOpen` above), leaving the
          // player looking at a freshly-minted anonymous account with no
          // explanation and the account they meant to import gone from the
          // input field too. Instead, open a SEPARATE trial socket with the
          // pasted token first (auth is a connect-time query param, so
          // validating it needs its own connection either way) and only
          // touch `TOKEN_KEY`/reload once that trial socket actually proves
          // the token live by receiving a real IdentityToken back — a
          // rejection reports `importError` (read by `frame()`, surfaced as
          // a toast on the Rust side) and leaves the CURRENT session's token
          // and connection completely untouched.
          importToken: function (token) {
            if (!token) return;
            var trialWs = new WebSocket(wsUrl(token), PROTOCOL);
            var settled = false;
            var timeout = setTimeout(function () {
              if (settled) return;
              settled = true;
              importError = 'Import failed: no response from server.';
              try { trialWs.close(); } catch (e) {}
            }, 8000);
            trialWs.onmessage = function (ev) {
              if (settled || typeof ev.data !== 'string') return;
              if (ev.data.lastIndexOf('{"IdentityToken"', 0) === 0) {
                settled = true;
                clearTimeout(timeout);
                localStorage.setItem(TOKEN_KEY, token);
                trialWs.close();
                window.location.reload();
              }
            };
            trialWs.onclose = function () {
              if (settled) return;
              settled = true;
              clearTimeout(timeout);
              importError = 'Import failed: that ID was rejected (invalid or expired).';
            };
          },
          // Keep downloads in one browser-tested path.  Appending the anchor
          // briefly matters on Safari and embedded web views, where clicking
          // a detached anchor is ignored.
          downloadBlob: function (blob, filename) {
            if (!blob || !blob.size) {
              console.warn('Export produced no data for ' + filename + '.');
              return false;
            }
            var link = document.createElement('a');
            var url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
            return true;
          },
          // The Rust frame has already rendered the clean share card when
          // this runs. Turning the game canvas into a Blob keeps the web
          // export a real PNG download rather than an OS-specific screenshot.
          downloadIslandImage: function () {
            var api = this;
            var canvas = document.getElementById('canvas');
            if (!canvas || !canvas.toBlob) return;
            canvas.toBlob(function (blob) {
              api.downloadBlob(blob, 'hexel-island.png');
            }, 'image/png');
          },
          // Browser-native replay export. `captureStream` records the exact
          // canvas the player sees (including the replay controls) without
          // moving hundreds of megabytes of frames through wasm. WebM is
          // broadly supported by Chromium and Firefox; it can be converted
          // to GIF/MP4 afterwards when a different delivery format is needed.
          startReplayRecording: function (scope) {
            var api = this;
            var canvas = document.getElementById('canvas');
            if (!canvas || !canvas.captureStream || !window.MediaRecorder) {
              console.warn('Replay recording is not supported by this browser.');
              return false;
            }
            if (this.replayRecorder && this.replayRecorder.state !== 'inactive') return false;
            var filename = 'hexel-' + (scope === 'world' ? 'world' : 'island') + '-timelapse.webm';
            var mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
              .find(function (type) { return MediaRecorder.isTypeSupported(type); });
            var chunks = [];
            var recorder;
            try {
              recorder = mimeType
                ? new MediaRecorder(canvas.captureStream(60), { mimeType: mimeType })
                : new MediaRecorder(canvas.captureStream(60));
            } catch (error) {
              console.warn('Could not start replay recording.', error);
              return false;
            }
            this.replayRecorder = recorder;
            recorder.ondataavailable = function (event) {
              if (event.data && event.data.size) chunks.push(event.data);
            };
            recorder.onstop = function () {
              api.replayRecorder = null;
              if (!chunks.length) {
                console.warn('Replay recording completed without video data.');
                return;
              }
              var blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
              api.offerExportDownload(blob, filename, 'video');
            };
            // One final dataavailable event is emitted by stop(), so no
            // periodic chunks are required before the eight-second export
            // completes. This is more reliable in Firefox and Safari.
            recorder.start();
            return true;
          },
          stopReplayRecording: function () {
            var recorder = this.replayRecorder;
            if (recorder && recorder.state !== 'inactive') recorder.stop();
          },
          // --- Export panel (markup is in the document; see the #export-panel
          // CSS for why this is DOM and not drawn in-game) ------------------
          exportPanel: function () {
            return {
              root: document.getElementById('export-panel'),
              label: document.getElementById('export-panel-label'),
              fill: document.getElementById('export-panel-fill'),
              track: document.getElementById('export-panel-track'),
            };
          },
          showExportProgress: function (percent, label) {
            var el = this.exportPanel();
            if (!el.root) return false;
            el.root.style.display = 'block';
            el.track.style.display = 'block';
            el.label.textContent = label;
            el.fill.style.width = Math.max(0, Math.min(100, percent)) + '%';
            return true;
          },
          hideExportProgress: function () {
            var el = this.exportPanel();
            // Never yank the panel out from under a finished capture that is
            // still waiting to be downloaded — `offerExportDownload` owns the
            // panel from that point until the user clicks (or dismisses).
            if (el.root && !this.pendingExport) el.root.style.display = 'none';
            return true;
          },
          // Holds the finished capture until the player asks for it, instead
          // of firing a download the moment recording stops. Deliberate:
          // an export landing in the downloads folder unannounced is jarring,
          // and there is no way to decline the file once it is written.

          // Save as soon as the capture is assembled. Recording is only ever
          // started by the overlay's Download button (replay.rs), so by the
          // time this runs the player has already asked for the file — there
          // is nothing left to confirm. The WebM recorder finishes
          // asynchronously, which is why this is a callback rather than a
          // value returned to wasm.
          offerExportDownload: function (blob, filename) {
            var el = this.exportPanel();
            if (el.root) el.root.style.display = 'none';
            return this.downloadBlob(blob, filename);
          },

          // The compact GIF bytes are encoded in wasm by raylib's bundled
          // msf_gif implementation. Copy them out of wasm memory before the
          // Rust caller frees the encoder result, then download normally.
          downloadReplayGif: function (ptr, length, scope) {
            // Emscripten keeps HEAPU8 in its generated script scope. The
            // normal build exposes it globally; Module.HEAPU8 is supported
            // too for builds that explicitly export runtime methods.
            var heap = typeof HEAPU8 !== 'undefined'
              ? HEAPU8
              : (window.Module && window.Module.HEAPU8);
            if (!ptr || !length || !heap) return false;
            var bytes = heap.slice(ptr, ptr + length);
            var blob = new Blob([bytes], { type: 'image/gif' });
            var filename = 'hexel-' + (scope === 'world' ? 'world' : 'island') + '-timelapse.gif';
            return this.offerExportDownload(blob, filename, 'GIF');
          },
        };
      })();

      // The game kept playing music and effects while its
      // tab was in the background — browsers don't mute hidden tabs on their
      // own. Suspending the audio context stops everything at once (music and
      // effects alike) and resumes exactly where it left off, which is what
      // raylib's own pause/volume calls can't do from outside the wasm side.
      // Miniaudio (raylib's web audio backend) tracks one AudioContext per
      // device on `window.miniaudio.devices`; that global only exists once
      // the module has initialised audio, so it's looked up per event rather
      // than captured here.
      (function () {
        function setAudioSuspended(suspended) {
          var devices = window.miniaudio && window.miniaudio.devices;
          if (!devices) return;
          for (var i = 0; i < devices.length; i++) {
            var context = devices[i] && devices[i].webaudio;
            if (!context) continue;
            // Both return promises that reject harmlessly if the context is
            // already in the target state, or if resume() is called before
            // the first user gesture.
            var pending = suspended ? context.suspend() : context.resume();
            if (pending && pending.catch) pending.catch(function () {});
          }
        }
        // `visibilitychange` (not blur/focus): it fires for the tab as a
        // whole, including inside the itch.io iframe, and doesn't mute merely
        // because focus moved to the URL bar or devtools.
        document.addEventListener('visibilitychange', function () {
          setAudioSuspended(document.hidden);
          // Read once per frame by stdb.frame(); see FrameData.page_returned.
          if (!document.hidden) window.hexelPageReturned = true;
        });
      })();

      // The title backdrop is baked from the world, and islands change slot
      // on every leaderboard re-rank, so a bake compiled into the wasm goes
      // stale as soon as the next one fires. A copy is served next to this
      // page and re-rendered after each re-rank; the wasm draws its own
      // embedded bake immediately and swaps to this one when it arrives.
      // Cache-busted by time rather than BUILD_VERSION, since the whole point
      // is that it changes without a rebuild.
      (function () {
        function fetchInto(url, path, binary) {
          return fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
.then(function (r) {
              if (!r.ok) throw new Error(r.status);
              return binary ? r.arrayBuffer() : r.text();
            })
.then(function (body) {
              FS.writeFile(path, binary ? new Uint8Array(body) : body);
            });
        }
        // Called from wasm once its filesystem exists — see `frame`'s
        // title-map request latch.
        window.hexelLoadTitleMap = function () {
          Promise.all([
            fetchInto('title-map.png', '/title-map-live.png', true),
            fetchInto('title-map-view.txt', '/title-map-live-view.txt', false),
          ])
            // Only once BOTH have landed: the image and the camera pose it
            // was rendered at get swapped together, and half a pair would
            // draw the map in the wrong place.
.then(function () { window.hexelTitleMapReady = true; })
.catch(function () { /* keep the embedded bake */ });
        };
      })();

      // Recovered replay history, prefetched in the background.
      //
      // This was an emscripten --preload-file until it became the single
      // worst thing about the load: preloaded files are run dependencies,
      // and emscripten blocks main() until they all resolve, so every
      // visitor waited on 258 MiB before the title screen drew its first
      // frame. Nothing touches it before `RecoveredReplay::open`, which
      // only ever runs from a replay/export button.
      //
      // Served precompressed (see build-web.sh + the Caddyfile), so what
      // actually crosses the wire is ~13 MiB — small enough that bin/web.rs
      // simply starts this once the title screen is up and lets it land
      // while the player reads the menu, rather than making them wait at
      // the point of export.
      (function () {
        var HISTORY_PATH = '/hexel-tile-history.bin';
        var state = 'idle';
        var message = '';

        // Polled from wasm only while a replay is waiting on this — see
        // `history_status` in bin/web.rs. Kept to a compact string because
        // it crosses the boundary through emscripten_run_script_string.
        window.hexelHistoryStatus = function () {
          if (state === 'error') return 'error:' + message;
          return state;
        };

        // Idempotent: the startup prefetch and any later button press share
        // one download rather than starting parallel ones.
        window.hexelEnsureHistory = function () {
          if (state === 'loading' || state === 'ready') return;
          state = 'loading';
          // ?v= rather than no-store: the bytes are immutable for a given
          // build, and the Caddyfile marks them cacheable for a year, so a
          // second visit should hit cache instead of re-downloading.
          fetch(HISTORY_PATH + '?v=' + BUILD_VERSION)
.then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.arrayBuffer();
            })
.then(function (buf) {
              var bytes = new Uint8Array(buf);
              // Straight into MEMFS at the path RECOVERED_HISTORY_PATH
              // opens. Same filesystem the preload used to populate, so
              // the Rust side is unchanged from here on.
              FS.writeFile(HISTORY_PATH, bytes);
              progress = 1;
              state = 'ready';
            })
.catch(function (error) {
              state = 'error';
              message = String((error && error.message) || error);
            });
        };
      })();
    </script>
    <!-- Built by: cargo build -p client --bin web --target wasm32-unknown-emscripten --release -->
    <script>document.write('<script src="web.js?v=' + BUILD_VERSION + '"><' + '/script>');</script>
  </body>

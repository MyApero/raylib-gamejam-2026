<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>hexel — raylib 6.0 + SpacetimeDB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      html, body {
        margin: 0;
        /* dvh tracks the actually-visible viewport (excludes the mobile
           browser's address/nav bar); vh is a fallback for browsers that
           don't support it (falls back cleanly since the later rule wins
           when supported). Without this, the bottom pane gets cropped by
           the bar on mobile since 100vh includes the space behind it. */
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background-color: #111;
      }
      /* Two independent copies of the game (see game.html) side by side so
         two people can play on one screen: left/right when the viewport is
         wider than tall (desktop), top/bottom when it's taller than wide
         (a phone held upright). Each pane is its own iframe/browsing
         context, so the two players get separate SpacetimeDB identities.
         Padding + gap give some breathing room around the edges and a
         visible divider between the two panes. */
      #dual {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        padding: 8px;
        gap: 8px;
        background-color: #111;
      }
      @media (orientation: landscape) {
        #dual { flex-direction: row; }
      }
      @media (orientation: portrait) {
        #dual { flex-direction: column; }
      }
      #dual iframe {
        flex: 1 1 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 2px solid #333;
        border-radius: 4px;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="dual"></div>
    <script>
      // How many game panes to show on one screen: 1 (solo) or 2 (local
      // two-player test). Each pane is its own iframe with a namespaced
      // ?slot=N so they get distinct SpacetimeDB identities.
      var PANES = 1;
      var dual = document.getElementById('dual');
      for (var i = 1; i <= PANES; i++) {
        var f = document.createElement('iframe');
        f.src = 'game.html?slot=' + i;
        f.setAttribute('allow', 'autoplay');
        dual.appendChild(f);
      }
    </script>
  </body>
</html>

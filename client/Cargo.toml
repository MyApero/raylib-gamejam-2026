[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = "6.0"
shared = { path = "../shared" }
include_dir = "0.7"

# Native desktop binary only (src/main.rs) — talks to SpacetimeDB over a
# live WebSocket subscription via the Rust SDK.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# Pinned to a local checkout of SpacetimeDB (2.7.0) because crates.io only
# publishes up to 2.6.1, which is missing APIs our generated bindings need.
# Switch back to a plain version once 2.7.0 lands on crates.io. See WORK.md.
spacetimedb-sdk = { git = "https://github.com/clockworklabs/SpacetimeDB", branch = "master" }
# Same crate the SDK's `credentials::File` uses to locate
# `~/.spacetimedb_client_credentials`, so "New account" deletes exactly the
# file the SDK would have loaded (see `creds_path`). Already in the lockfile
# as an SDK dependency — this only makes it a direct one.
home = "0.5"

# Web binary only (src/bin/web.rs) — the SDK's browser support needs
# wasm-bindgen, which does not support wasm32-unknown-emscripten (raylib's
# web target), so this binary polls SpacetimeDB's plain HTTP API instead.
# See README.web.md.
[target.'cfg(target_os = "emscripten")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
